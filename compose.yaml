services:
  rabbitmq:
    image: rabbitmq:4.1-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-contacts}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-contacts-dev-only}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
  rabbitmq-test:
    profiles: [integration]
    image: rabbitmq:4.1-management
    ports:
      - "127.0.0.1:5673:5672"
    environment:
      RABBITMQ_DEFAULT_USER: contacts-test
      RABBITMQ_DEFAULT_PASS: contacts-test-only
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: [start-dev, --import-realm]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KC_HOSTNAME: http://localhost:8081
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-bootstrap-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Run the Java identity init-env command first}
      CONTACTS_USER_PASSWORD: ${CONTACTS_USER_PASSWORD:?Missing demo user password}
      CONTACTS_ADMIN_PASSWORD: ${CONTACTS_ADMIN_PASSWORD:?Missing demo admin password}
      CONTACTS_REPORTER_SECRET: ${CONTACTS_REPORTER_SECRET:?Missing reporter secret}
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./identity/realm:/opt/keycloak/data/import:ro

volumes:
  rabbitmq-data:
  keycloak-data:
