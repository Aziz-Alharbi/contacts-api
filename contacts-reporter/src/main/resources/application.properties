# Independent, local demonstration endpoint; no database or inbound user login.
quarkus.http.host=127.0.0.1
quarkus.http.port=8082
quarkus.http.test-port=0
quarkus.compose.devservices.enabled=false

quarkus.rest-client.contacts-api.url=${CONTACTS_API_URL:http://localhost:8080}
quarkus.rest-client.contacts-api.connect-timeout=5000
quarkus.rest-client.contacts-api.read-timeout=10000
quarkus.rest-client.logging.scope=none

quarkus.oidc-client.auth-server-url=${KEYCLOAK_URL:http://localhost:8081}/realms/contacts
quarkus.oidc-client.client-id=${CONTACTS_REPORTER_CLIENT_ID:contacts-reporter}
quarkus.oidc-client.credentials.secret=${CONTACTS_REPORTER_SECRET}
quarkus.oidc-client.grant.type=client
quarkus.oidc-client.early-tokens-acquisition=false
quarkus.oidc-client.connection-timeout=5S
quarkus.log.category."io.quarkus.oidc.client".level=WARN

# Optional command mode; normal Reporter startup and service authentication are unchanged.
%tools.quarkus.package.main-class=tools
%tools.quarkus.package.output-directory=tools-app
%tools.quarkus.http.host-enabled=false
%tools.quarkus.oidc-client.enabled=false
%tools.quarkus.oidc-client.credentials.secret=
%tools.quarkus.banner.enabled=false
%tools.quarkus.log.level=WARN
