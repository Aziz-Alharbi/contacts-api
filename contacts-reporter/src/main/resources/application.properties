# Independent, local demonstration endpoint; no database or inbound user login.
quarkus.http.host=127.0.0.1
quarkus.http.port=8082
quarkus.http.test-port=0
quarkus.compose.devservices.enabled=false

quarkus.rest-client.contacts-api.url=${CONTACTS_API_URL:http://localhost:8080}
quarkus.rest-client.contacts-api.connect-timeout=5000
quarkus.rest-client.contacts-api.read-timeout=10000
quarkus.rest-client.logging.scope=none

quarkus.oidc-client.auth-server-url=${KEYCLOAK_URL:http://localhost:8081}/realms/contacts
quarkus.oidc-client.client-id=${CONTACTS_REPORTER_CLIENT_ID:contacts-reporter}
quarkus.oidc-client.credentials.secret=${CONTACTS_REPORTER_SECRET}
quarkus.oidc-client.grant.type=client
quarkus.oidc-client.early-tokens-acquisition=false
quarkus.oidc-client.connection-timeout=5S
quarkus.log.category."io.quarkus.oidc.client".level=WARN

# Optional command mode; normal Reporter startup and service authentication are unchanged.
%tools.quarkus.package.main-class=tools
%tools.quarkus.package.output-directory=tools-app
%tools.quarkus.http.host-enabled=false
%tools.quarkus.oidc-client.enabled=false
%tools.quarkus.oidc-client.credentials.secret=
%tools.quarkus.banner.enabled=false
%tools.quarkus.log.level=WARN


# Shared RabbitMQ development connection (credentials are local demo defaults).
rabbitmq.host=${RABBITMQ_HOST:localhost}
rabbitmq.port=${RABBITMQ_PORT:5672}
rabbitmq.username=${RABBITMQ_USERNAME:contacts}
rabbitmq.password=${RABBITMQ_PASSWORD:contacts-dev-only}
rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
contacts.messaging.enabled=true
%test.contacts.messaging.enabled=false
%tools.contacts.messaging.enabled=false
contacts.messaging.fail-event-id=${CONTACTS_FAIL_EVENT_ID:}


# Kafka AMQP-independent connection and versioned topics.
contacts.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
contacts.kafka.topic=${KAFKA_CONTACT_TOPIC:contacts.contact-created.v1}
contacts.kafka.counts-topic=${KAFKA_COUNTS_TOPIC:contacts.reporter.contact-counts.v1}
contacts.kafka.partitions=${KAFKA_PARTITIONS:3}
contacts.kafka.replication-factor=${KAFKA_REPLICATION_FACTOR:1}
contacts.kafka.security-protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
contacts.kafka.sasl-mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
contacts.kafka.sasl-jaas-config=${KAFKA_SASL_JAAS_CONFIG:}
contacts.kafka.enabled=true
%test.contacts.kafka.enabled=false
%tools.contacts.kafka.enabled=false
contacts.kafka.application-id=${KAFKA_REPORTER_APPLICATION_ID:contacts-reporter-v1}
contacts.kafka.state-dir=${KAFKA_STATE_DIR:.kafka-state}
