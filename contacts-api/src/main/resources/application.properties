quarkus.datasource.db-kind=mysql

quarkus.hibernate-orm.schema-management.strategy=none

quarkus.flyway.migrate-at-start=true


%dev.quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/contacts_db
%dev.quarkus.datasource.username=root
%dev.quarkus.datasource.password=${DB_PASSWORD}

%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# Bearer JWT validation against the contacts realm (JWKS and issuer via discovery).
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8081}/realms/contacts
quarkus.oidc.client-id=contacts-api
quarkus.oidc.token.audience=contacts-api
quarkus.oidc.token.subject-required=true
quarkus.oidc.token.signature-algorithm=RS256
quarkus.oidc.token.allow-jwt-introspection=false
quarkus.oidc.token.allow-opaque-token-introspection=false
quarkus.oidc.roles.role-claim-path=roles
quarkus.oidc.devservices.enabled=false
quarkus.http.auth.permission.api.paths=/api/v1/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# OIDC signature failures can include the raw JWT at WARN; keep it out of logs.
quarkus.log.category."io.quarkus.oidc.runtime.OidcProvider".level=ERROR
# Enable PKCE for Swagger UI OAuth2 login
quarkus.swagger-ui.oauth-use-pkce-with-authorization-code-grant=true

# Shared RabbitMQ development connection (credentials are local demo defaults).
rabbitmq.host=${RABBITMQ_HOST:localhost}
rabbitmq.port=${RABBITMQ_PORT:5672}
rabbitmq.username=${RABBITMQ_USERNAME:contacts}
rabbitmq.password=${RABBITMQ_PASSWORD:contacts-dev-only}
rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
contacts.messaging.enabled=true
%test.contacts.messaging.enabled=false


# Kafka AMQP-independent connection and versioned topics.
contacts.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
contacts.kafka.topic=${KAFKA_CONTACT_TOPIC:contacts.contact-created.v1}
contacts.kafka.counts-topic=${KAFKA_COUNTS_TOPIC:contacts.reporter.contact-counts.v1}
contacts.kafka.partitions=${KAFKA_PARTITIONS:3}
contacts.kafka.replication-factor=${KAFKA_REPLICATION_FACTOR:1}
contacts.kafka.security-protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
contacts.kafka.sasl-mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
contacts.kafka.sasl-jaas-config=${KAFKA_SASL_JAAS_CONFIG:}

# Readiness probes use short-lived Admin clients; keep event logs readable.
quarkus.log.category."org.apache.kafka.clients.admin".level=WARN
quarkus.log.category."org.apache.kafka.common.metrics".level=WARN
quarkus.log.category."org.apache.kafka.common.utils.AppInfoParser".level=WARN
