global:
  scrape_interval: 15s
  scrape_timeout: 5s
scrape_configs:
  - job_name: contacts-api
    metrics_path: /q/metrics
    dns_sd_configs:
      - names: ['contacts-api-metrics.contacts-local.svc.cluster.local']
        type: A
        port: 8080
        refresh_interval: 15s
  - job_name: contacts-reporter
    metrics_path: /q/metrics
    static_configs:
      - targets: ['192.168.49.14:8082']
