# Optional tools only; starting a named tool does not recreate application containers.
services:
  contacts-reporter:
    image: ${CONTACTS_REPORTER_OBSERVABILITY_IMAGE:-contacts-reporter:observability-20261022}
    environment:
      OTEL_SDK_DISABLED: ${CONTACTS_TRACING_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://192.168.49.20:4317
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [metrics]
    # Share node networking; a private resolver mount discovers both API Pods.
    network_mode: container:contacts-local
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
      - --storage.tsdb.retention.size=128MB
    volumes:
      - ./observability/resolv.conf:/etc/resolv.conf:ro
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - observability-prometheus:/prometheus
    mem_limit: 192m
    cpus: 0.25
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  grafana:
    image: grafana/grafana:12.1.1
    profiles: [dashboard]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    # Create an internal random admin password without embedding a demo credential.
    entrypoint: [/bin/sh, -ec]
    command:
      - 'umask 077; mkdir -p /tmp/admin; head -c 48 /dev/urandom | base64 > /tmp/admin/password; export GF_SECURITY_ADMIN_PASSWORD__FILE=/tmp/admin/password; exec /run.sh'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - observability-grafana:/var/lib/grafana
    mem_limit: 192m
    cpus: 0.25
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  jaeger:
    image: jaegertracing/jaeger:2.10.0
    profiles: [tracing]
    ports: ["127.0.0.1:16686:16686"]
    networks:
      default:
        ipv4_address: 192.168.49.20
    environment:
      GOMEMLIMIT: 160MiB
    mem_limit: 256m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  observability-prometheus:
  observability-grafana:
